# Local development only; hosted Auth settings are managed in the project dashboard.
# Generated with Supabase CLI 2.121.0, reduced to the services used by this slice.
project_id = "triagelens-dev"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
# Local fake users only. Hosted email confirmation remains enabled.
enable_confirmations = false

[local_smtp]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
